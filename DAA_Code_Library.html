<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAA Code Library</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151c31;--muted:#a9b4d0;--accent:#8ca7ff;--line:#293451}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2548,#0b1020 50%);color:#edf2ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{padding:32px 18px 22px;text-align:center}h1{margin:0;font-size:clamp(28px,5vw,42px)}header p{color:var(--muted);margin:8px 0 0}.wrap{max-width:1050px;margin:auto;padding:0 16px 48px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}.search{flex:1;min-width:230px;background:#10172a;color:white;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:16px}.count{color:var(--muted);align-self:center}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}.cardhead{display:flex;align-items:center;gap:12px;padding:16px}.num{color:var(--accent);font-weight:700;font-size:14px;min-width:24px}.title{font-weight:650;flex:1}.buttons{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid #384568;background:#202b48;color:#edf2ff;border-radius:9px;padding:8px 11px;cursor:pointer}.button:hover{background:#2b3a61}.codebox{display:none;border-top:1px solid var(--line)}.codebox.open{display:block}pre{margin:0;padding:18px;overflow:auto;background:#080d19;color:#d9e5ff;font-size:13px;line-height:1.55;max-height:70vh}footer{color:var(--muted);text-align:center;padding:18px;font-size:13px}.empty{display:none;text-align:center;color:var(--muted);padding:25px}.tag{font-size:12px;color:#b8c5e9;border:1px solid var(--line);border-radius:99px;padding:3px 8px} @media(max-width:560px){.cardhead{align-items:flex-start;flex-wrap:wrap}.title{min-width:65%}.buttons{width:100%}.button{flex:1}}
</style></head><body><header><h1>DAA Code Library</h1><p>12 verified C programs · Search, open, and copy code for practicals</p></header><main class="wrap"><div class="toolbar"><input class="search" id="search" placeholder="Search e.g. Dijkstra, Merge Sort, Knapsack…" autocomplete="off"><span class="count" id="count"></span></div><div id="list"></div><div class="empty" id="empty">No programs found. Try another search.</div></main><footer>Offline-ready mini website · Codes are sample-input programs for lab practice</footer><script>
const programs=[{"file": "01_iterative_binary_search.c", "title": "Iterative Binary Search", "code": "#include <stdio.h>\nint binarySearch(int a[], int n, int key) {\n    int low = 0, high = n - 1;\n    while (low <= high) {\n        int mid = (low + high) / 2;\n        if (a[mid] == key) return mid + 1; // 1-based position\n        if (key < a[mid]) high = mid - 1;\n        else low = mid + 1;\n    }\n    return 0;\n}\nint main(void) {\n    int a[] = {5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80};\n    int n = sizeof(a)/sizeof(a[0]), key = 50;\n    int result = binarySearch(a,n,key);\n    if (result) printf(\"Element found at Position %d\\n\", result);\n    else printf(\"Element not found\\n\");\n    return 0;\n}\n"}, {"file": "02_recursive_binary_search.c", "title": "Recursive Binary Search", "code": "#include <stdio.h>\nint binarySearch(int a[], int low, int high, int key) {\n    if (low > high) return 0;\n    int mid = (low + high) / 2;\n    if (a[mid] == key) return mid + 1; // 1-based position\n    if (key < a[mid]) return binarySearch(a, low, mid - 1, key);\n    return binarySearch(a, mid + 1, high, key);\n}\nint main(void) {\n    int a[] = {5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80};\n    int n = sizeof(a)/sizeof(a[0]), key = 50;\n    int result = binarySearch(a,0,n-1,key);\n    if (result) printf(\"Element found at Position %d\\n\", result);\n    else printf(\"Element not found\\n\");\n    return 0;\n}\n"}, {"file": "03_quick_sort.c", "title": "Quick Sort", "code": "#include <stdio.h>\nint partition(int arr[], int lb, int ub) {\n    int pivot = arr[lb], start = lb, end = ub;\n    while (start < end) {\n        while (start < end && arr[start] <= pivot) start++;\n        while (arr[end] > pivot) end--;\n        if (start < end) { int t=arr[start]; arr[start]=arr[end]; arr[end]=t; }\n    }\n    arr[lb] = arr[end]; arr[end] = pivot;\n    return end;\n}\nvoid quick_sort(int arr[], int lb, int ub) {\n    if (lb < ub) { int loc=partition(arr,lb,ub); quick_sort(arr,lb,loc-1); quick_sort(arr,loc+1,ub); }\n}\nint main(void) {\n    int arr[]={60,40,20,95,90,30,50,70}, n=8;\n    quick_sort(arr,0,n-1);\n    printf(\"Sorted array:\\n\");\n    for(int i=0;i<n;i++) printf(\"%d\\t\",arr[i]);\n    printf(\"\\n\"); return 0;\n}\n"}, {"file": "04_merge_sort.c", "title": "Merge Sort", "code": "#include <stdio.h>\nvoid merge(int a[], int low, int mid, int high) {\n    int i=low, j=mid+1, k=0, temp[50];\n    while(i<=mid && j<=high) temp[k++]=(a[i]<a[j])?a[i++]:a[j++];\n    while(i<=mid) temp[k++]=a[i++];\n    while(j<=high) temp[k++]=a[j++];\n    for(i=low,k=0;i<=high;i++,k++) a[i]=temp[k];\n}\nvoid mergesort(int a[], int low, int high) {\n    if(low<high) { int mid=(low+high)/2; mergesort(a,low,mid); mergesort(a,mid+1,high); merge(a,low,mid,high); }\n}\nint main(void) {\n    int a[]={38,27,43,10,9,82}, n=6;\n    mergesort(a,0,n-1);\n    printf(\"Sorted array:\\n\");\n    for(int i=0;i<n;i++) printf(\"%d\\t\",a[i]);\n    printf(\"\\n\"); return 0;\n}\n"}, {"file": "05_knapsack_01.c", "title": "Knapsack 01", "code": "#include <stdio.h>\nint max(int a,int b){ return a>b?a:b; }\nint main(void) {\n    int n=4, capacity=5;\n    int wt[]={0,3,2,4,1}, profit[]={0,100,20,60,40};\n    int V[5][6]={0};\n    for(int i=1;i<=n;i++) for(int w=1;w<=capacity;w++) {\n        if(wt[i]<=w) V[i][w]=max(V[i-1][w],V[i-1][w-wt[i]]+profit[i]);\n        else V[i][w]=V[i-1][w];\n    }\n    printf(\"Maximum Profit = %d\\n\",V[n][capacity]);\n    return 0;\n}\n"}, {"file": "06_min_max_divide_conquer.c", "title": "Min Max Divide Conquer", "code": "#include <stdio.h>\nvoid MinMax(int arr[],int low,int high,int *min,int *max) {\n    if(low==high){*min=*max=arr[low]; return;}\n    if(high==low+1){if(arr[low]<arr[high]){*min=arr[low];*max=arr[high];}else{*min=arr[high];*max=arr[low];}return;}\n    int mid=(low+high)/2,min1,max1,min2,max2;\n    MinMax(arr,low,mid,&min1,&max1); MinMax(arr,mid+1,high,&min2,&max2);\n    *min=min1<min2?min1:min2; *max=max1>max2?max1:max2;\n}\nint main(void){int arr[]={6,5,70,8,15,30},n=6,min,max;MinMax(arr,0,n-1,&min,&max);printf(\"Minimum Element = %d\\nMaximum Element = %d\\n\",min,max);return 0;}\n"}, {"file": "07_dijkstra.c", "title": "Dijkstra", "code": "#include <stdio.h>\n#define V 4\n#define INF 999\nint minDist(int dist[],int visited[]){int min=INF,idx=-1;for(int i=0;i<V;i++)if(!visited[i]&&dist[i]<min){min=dist[i];idx=i;}return idx;}\nvoid dijkstra(int graph[V][V],int src){int dist[V],visited[V]={0};for(int i=0;i<V;i++)dist[i]=INF;dist[src]=0;\n for(int count=0;count<V;count++){int u=minDist(dist,visited);if(u==-1)break;visited[u]=1;\n  for(int v=0;v<V;v++)if(!visited[v]&&graph[u][v]>0&&dist[u]!=INF&&dist[u]+graph[u][v]<dist[v])dist[v]=dist[u]+graph[u][v];}\n printf(\"Vertex\\tDistance\\n\");for(int i=0;i<V;i++)printf(\"%d\\t%d\\n\",i,dist[i]);}\nint main(void){int graph[V][V]={{0,1,4,0},{1,0,2,6},{4,2,0,3},{0,6,3,0}};dijkstra(graph,0);return 0;}\n"}, {"file": "08_floyd_warshall.c", "title": "Floyd Warshall", "code": "#include <stdio.h>\n#define INF 999999\n#define N 4\nvoid Short_Path(int d[N][N]){\n for(int k=0;k<N;k++)for(int i=0;i<N;i++)for(int j=0;j<N;j++)if(d[i][k]!=INF&&d[k][j]!=INF&&d[i][j]>d[i][k]+d[k][j])d[i][j]=d[i][k]+d[k][j];\n printf(\"Shortest path matrix:\\n\");for(int i=0;i<N;i++){for(int j=0;j<N;j++)if(d[i][j]==INF)printf(\"INF\\t\");else printf(\"%d\\t\",d[i][j]);printf(\"\\n\");}}\nint main(void){int dist[N][N]={{0,3,INF,7},{8,0,2,INF},{5,INF,0,1},{2,INF,INF,0}};Short_Path(dist);return 0;}\n"}, {"file": "09_selection_sort.c", "title": "Selection Sort", "code": "#include <stdio.h>\nvoid Selection_Sort(int a[],int n){for(int k=0;k<n-1;k++){int loc=k;for(int j=k+1;j<n;j++)if(a[j]<a[loc])loc=j;int t=a[k];a[k]=a[loc];a[loc]=t;}}\nint main(void){int a[]={20,50,70,30,60,10},n=6;Selection_Sort(a,n);printf(\"Sorted Array:\\n\");for(int i=0;i<n;i++)printf(\"%d\\t\",a[i]);printf(\"\\n\");return 0;}\n"}, {"file": "10_job_sequencing.c", "title": "Job Sequencing", "code": "#include <stdio.h>\n#define MAX 20\nint main(void){int profit[]={25,17,12,7,3},deadline[]={2,2,1,3,3},n=5;\n int jobs[MAX],maxD=0;for(int i=0;i<n;i++){jobs[i]=i;if(deadline[i]>maxD)maxD=deadline[i];}\n for(int i=0;i<n-1;i++)for(int j=i+1;j<n;j++)if(profit[jobs[j]]>profit[jobs[i]]){int t=jobs[i];jobs[i]=jobs[j];jobs[j]=t;}\n int slot[MAX];for(int i=0;i<maxD;i++)slot[i]=-1;int total=0;\n for(int i=0;i<n;i++){int job=jobs[i];for(int s=deadline[job]-1;s>=0;s--)if(s<maxD&&slot[s]==-1){slot[s]=job;total+=profit[job];break;}}\n printf(\"Selected Jobs: \");for(int s=0;s<maxD;s++)if(slot[s]!=-1)printf(\"J%d \",slot[s]+1);printf(\"\\nMax Profit = %d\\n\",total);return 0;}\n"}, {"file": "11_binary_tree_inorder.c", "title": "Binary Tree Inorder", "code": "#include <stdio.h>\n#include <stdlib.h>\nstruct node{int data;struct node*left;struct node*right;};\nstruct node*CreateNode(int value){struct node*newNode=(struct node*)malloc(sizeof(struct node));if(!newNode){perror(\"malloc\");exit(1);}newNode->data=value;newNode->left=NULL;newNode->right=NULL;return newNode;}\nvoid inorder(struct node*root){if(root){inorder(root->left);printf(\"%d \",root->data);inorder(root->right);}}\nint main(void){struct node*root=CreateNode(1);root->left=CreateNode(2);root->right=CreateNode(3);root->left->left=CreateNode(4);root->left->right=CreateNode(5);printf(\"Inorder Traversal: \");inorder(root);printf(\"\\n\");return 0;}\n"}, {"file": "12_kruskal.c", "title": "Kruskal", "code": "#include <stdio.h>\n#define N 4\n#define INF 999\nint parent[N];\nint find(int i){while(parent[i]!=i)i=parent[i];return i;}\nint unite(int a,int b){a=find(a);b=find(b);if(a==b)return 0;parent[b]=a;return 1;}\nint main(void){int cost[N][N]={{INF,10,6,5},{10,INF,INF,15},{6,INF,INF,4},{5,15,4,INF}};\n for(int i=0;i<N;i++) parent[i]=i;\n int edges=0,total=0; printf(\"Edges of Minimum Spanning Tree:\\n\");\n while(edges<N-1){int min=INF,a=-1,b=-1;for(int i=0;i<N;i++)for(int j=i+1;j<N;j++)if(cost[i][j]<min){min=cost[i][j];a=i;b=j;}\n  if(a==-1) break;\n  cost[a][b]=cost[b][a]=INF;\n  if(unite(a,b)){printf(\"Edge (%d, %d) = %d\\n\",a+1,b+1,min);total+=min;edges++;}\n }\n printf(\"Minimum Cost = %d\\n\",total);return 0;}\n"}];
const list=document.getElementById('list'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty');
function render(){let q=search.value.trim().toLowerCase();let shown=programs.filter(p=>(p.title+' '+p.file+' '+p.code).toLowerCase().includes(q));list.innerHTML='';count.textContent=shown.length+' / '+programs.length+' programs';empty.style.display=shown.length?'none':'block';shown.forEach(p=>{let idx=programs.indexOf(p);let card=document.createElement('section');card.className='card';card.innerHTML=`<div class="cardhead"><span class="num">${String(idx+1).padStart(2,'0')}</span><span class="title">${p.title}</span><span class="tag">C</span><div class="buttons"><button class="button toggle">Show code</button><button class="button copy">Copy code</button></div></div><div class="codebox"><pre></pre></div>`;card.querySelector('pre').textContent=p.code;let codebox=card.querySelector('.codebox');card.querySelector('.toggle').onclick=()=>{codebox.classList.toggle('open');card.querySelector('.toggle').textContent=codebox.classList.contains('open')?'Hide code':'Show code'};card.querySelector('.copy').onclick=async e=>{try{await navigator.clipboard.writeText(p.code);e.target.textContent='Copied!';setTimeout(()=>e.target.textContent='Copy code',1200)}catch{e.target.textContent='Select code to copy'}};list.appendChild(card)});}
search.addEventListener('input',render);render();
</script></body></html>
